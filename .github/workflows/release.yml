# Baut eine signierte APK und veröffentlicht sie als GitHub Release
# (Tag vX.Y.Z wird dabei automatisch angelegt) – dort findet Obtainium die Updates.
#
# Auslöser: Änderung der Datei VERSION, oder manuell unter
# Actions → Release → "Run workflow".
name: Release

on:
  push:
    branches: [main, 'claude/**']
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version aus der Datei VERSION lesen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::VERSION muss das Format X.Y.Z haben, ist aber '$NAME'"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if gh release view "v$NAME" > /dev/null 2>&1; then
            echo "::error::Release v$NAME existiert bereits – bitte VERSION erhöhen."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Signatur-Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 (oder SIGNING_KEYSTORE_BASE64) fehlt – siehe README (Abschnitt Release)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests und signierte APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "family-list.apk"

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "family-list.apk" \
            --target "$GITHUB_SHA" \
            --title "Family List ${{ steps.version.outputs.name }}" \
            --generate-notes
